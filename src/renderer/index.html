<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'">
  <title>COMPTABLOO</title>
  <link rel="icon" type="image/png" href="assets/brand.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app-root">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/brand.png" alt="Logo COMPTABLOO">
        <div class="brand-txt">
          <span class="brand-name">COMPTABLOO</span>
          <span class="brand-sub">Comptabilité simple</span>
        </div>
      </div>
      <nav class="side-nav" id="side-nav">
        <a class="nav-item" data-page="dashboard" href="#/dashboard"><span class="nav-ico" data-icon="dashboard"></span>Tableau de bord</a>
        <a class="nav-item" data-page="sales" href="#/sales"><span class="nav-ico" data-icon="sales"></span>Ventes</a>
        <a class="nav-item" data-page="purchases" href="#/purchases"><span class="nav-ico" data-icon="purchases"></span>Achats</a>
        <a class="nav-item" data-page="stock" href="#/stock"><span class="nav-ico" data-icon="stock"></span>Stock</a>
        <a class="nav-item" data-page="clients" href="#/clients"><span class="nav-ico" data-icon="clients"></span>Clients</a>
        <a class="nav-item" data-page="suppliers" href="#/suppliers"><span class="nav-ico" data-icon="suppliers"></span>Fournisseurs</a>
        <a class="nav-item" data-page="accounting" href="#/accounting"><span class="nav-ico" data-icon="accounting"></span>Comptabilité</a>
        <a class="nav-item" data-page="reports" href="#/reports"><span class="nav-ico" data-icon="reports"></span>Rapports</a>
      </nav>
      <div class="side-foot">
        <a class="nav-item" data-page="settings" href="#/settings"><span class="nav-ico" data-icon="settings"></span>Paramètres</a>
        <div class="side-company" id="side-company"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Tableau de bord</h1>
          <span class="topbar-sub" id="page-sub"></span>
        </div>
        <div class="topbar-right">
          <span class="chip" id="chip-date"></span>
          <span class="chip chip-company" id="chip-company"></span>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div id="onboarding-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-root"></div>

  <!-- Ordre important : logique → données → interface -->
  <script src="../shared/logic.js"></script>
  <script src="../shared/seed.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages/docs.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/purchases.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/contacts.js"></script>
  <script src="js/pages/accounting.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
